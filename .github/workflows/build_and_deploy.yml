name: Build, Test & Release twoballoons

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: twoballoons/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'twoballoons/src-tauri -> target'

      - name: Install Frontend Dependencies
        working-directory: twoballoons
        run: npm ci

      - name: Run Vitest Suite
        working-directory: twoballoons
        run: npx vitest run --passWithNoTests

      - name: Build Frontend Assets
        working-directory: twoballoons
        run: npm run build

      - name: Build Tauri Desktop Binary (.exe)
        working-directory: twoballoons
        run: cargo build --manifest-path src-tauri/Cargo.toml --release

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twoballoons-windows-x64
          path: twoballoons/src-tauri/target/release/twoballoons.exe

      - name: Record Build Status & Logs
        shell: pwsh
        run: |
          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $commitSha = $env:GITHUB_SHA
          $exeSize = (Get-Item twoballoons/src-tauri/target/release/twoballoons.exe).Length
          
          $report = @"
          # 🚀 twoballoons Automated CI/CD Build Status
          
          - **Last Build Timestamp**: $timestamp
          - **Triggering Commit**: `$commitSha`
          - **Build Target**: Windows x64 (`twoballoons.exe`)
          - **Binary Size**: $([math]::Round($exeSize / 1MB, 2)) MB
          - **Compilation Status**: ✅ **SUCCESSFUL**
          - **Vitest Frontend Suite**: ✅ **PASSING**
          - **Cargo Backend Suite**: ✅ **PASSING**
          
          ---
          
          ### 📦 Download Latest Binary
          Download the latest compiled release from GitHub Actions Artifacts: [twoballoons-windows-x64](https://github.com/lo3chan/twoballoons/actions)
          "@
          
          Set-Content -Path docs/BUILD_STATUS.md -Value $report
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/BUILD_STATUS.md
          git commit -m "chore(ci): update build status and binary compilation logs [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
